name: Workflow System Tests

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'app/(dashboard)/workflows/**'
      - 'scripts/060_create_workflow_system.sql'
      - '.github/workflows/workflow-tests.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'app/(dashboard)/workflows/**'
      - 'scripts/060_create_workflow_system.sql'

jobs:
  workflow-schema-validation:
    name: Validate Workflow Schema
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate SQL Schema
        run: |
          echo "Validating workflow system SQL schema..."
          if [ ! -f "scripts/060_create_workflow_system.sql" ]; then
            echo "⚠ Workflow SQL schema file not found. Skipping validation."
            exit 0
          fi
          
          # Check for required tables
          required_tables=(
            "workflow_definitions"
            "workflow_instances"
            "workflow_transitions"
            "workflow_approvals"
            "workflow_rules"
            "workflow_notifications"
          )
          
          for table in "${required_tables[@]}"; do
            if ! grep -q "CREATE TABLE.*$table" scripts/060_create_workflow_system.sql; then
              echo "Error: Required table '$table' not found in schema"
              exit 1
            fi
            echo "✓ Table '$table' found"
          done
          
          # Check for required functions
          required_functions=(
            "get_pending_approvals"
            "transition_workflow_stage"
          )
          
          for func in "${required_functions[@]}"; do
            if ! grep -q "CREATE.*FUNCTION.*$func" scripts/060_create_workflow_system.sql; then
              echo "Error: Required function '$func' not found in schema"
              exit 1
            fi
            echo "✓ Function '$func' found"
          done
          
          echo "Schema validation passed!"

  workflow-actions-validation:
    name: Validate Workflow Actions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check workflow actions
        run: |
          echo "Type checking workflow actions..."
          if [ ! -f "app/(dashboard)/workflows/actions.ts" ]; then
            echo "⚠ Workflow actions file not found. Skipping type check."
            exit 0
          fi
          npx tsc --noEmit "app/(dashboard)/workflows/actions.ts"
          echo "Type check passed!"

      - name: Check for required exports
        run: |
          echo "Checking for required workflow action exports..."
          if [ ! -f "app/(dashboard)/workflows/actions.ts" ]; then
            echo "⚠ Workflow actions file not found. Skipping export check."
            exit 0
          fi
          
          required_exports=(
            "getWorkflowDefinitions"
            "getWorkflowInstances"
            "createWorkflowInstance"
            "transitionWorkflowStage"
            "approveWorkflowStage"
            "rejectWorkflowStage"
            "getPendingApprovals"
          )
          
          for export_name in "${required_exports[@]}"; do
            if ! grep -q "export.*$export_name" "app/(dashboard)/workflows/actions.ts"; then
              echo "Error: Required export '$export_name' not found"
              exit 1
            fi
            echo "✓ Export '$export_name' found"
          done
          
          echo "All required exports found!"

  workflow-ui-validation:
    name: Validate Workflow UI Components
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check workflow UI components
        run: |
          echo "Type checking workflow UI components..."
          if [ ! -d "app/(dashboard)/workflows" ]; then
            echo "⚠ Workflow directory not found. Skipping type check."
            exit 0
          fi
          
          # Find all TypeScript files in workflows directory
          workflow_files=$(find "app/(dashboard)/workflows" -name "*.tsx" -o -name "*.ts" 2>/dev/null || true)
          if [ -z "$workflow_files" ]; then
            echo "⚠ No workflow TypeScript files found. Skipping type check."
            exit 0
          fi
          
          # Type check each file
          for file in $workflow_files; do
            npx tsc --noEmit "$file" || exit 1
          done
          echo "Type check passed!"

      - name: Check for required UI files
        run: |
          echo "Checking for required UI components..."
          if [ ! -d "app/(dashboard)/workflows" ]; then
            echo "⚠ Workflow directory not found. Skipping file check."
            exit 0
          fi
          
          required_files=(
            "app/(dashboard)/workflows/page.tsx"
            "app/(dashboard)/workflows/[id]/page.tsx"
            "app/(dashboard)/workflows/actions.ts"
          )
          
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "⚠ File '$file' not found (workflow system may not be implemented yet)"
            else
              echo "✓ File '$file' found"
            fi
          done
          
          echo "File check completed!"
